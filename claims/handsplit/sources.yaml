# Hand-picked sources for claims/split.py (used until Dev 1's index lands).
# Put the PDF or .txt file in claims/handsplit/files/ and add an entry below.
#
# reuse_allowed must be true or split.py skips the source. Only set it after you
# have read the license on the source page yourself.
# page_offset: PDF page number minus printed page number (front matter), so
#   locators match the printed book. 0 if they already line up.
# has_pages: false for sources with no real pages (web texts), locator becomes null.
# source_type: excavation_report | primary_text | scholarship | reference | dataset
#
# Tell Dev 1 which source_ids live here so they can append
# claims/handsplit/passages.jsonl to data/passages.jsonl as-is (keeps passage_ids stable).

