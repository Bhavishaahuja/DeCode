discovery:
  openalex:
    licenses_allowed:
    - cc-by
    - cc-by-sa
    - cc0
    - public-domain
    - cc-by-nc
    - cc-by-nc-sa
    - cc-by-nd
    - cc-by-nc-nd
    note: Only works whose best open-access location has one of these licenses are ingested. The license is recorded per work. NC/ND works are fine for this non-commercial project; drop
      them from the list for commercial use.
    queries:
      giza:
        max_sources: 22
        must_match: giza|khufu|cheops|khafre|menkaure|great pyramid|old kingdom|pyramid
        queries:
        - Giza pyramids construction
        - Great Pyramid Khufu
        - Giza plateau archaeology
        - Wadi al-Jarf papyri harbour
        - Egyptian pyramid ramp transport blocks
        - Nile branch pyramids Ahramat
        - Old Kingdom quarry limestone Tura
        - Heit el-Ghurab pyramid workers
        - sledge wet sand friction ancient Egypt
        - Great Pyramid orientation cardinal
      mohenjo_daro:
        max_sources: 30
        must_match: mohenjo|moenjo|harappa|indus
        queries:
        - Mohenjo-daro
        - Indus civilization water management drainage
        - Harappan urban planning
        - Indus Valley baked brick
        - Harappan wells hydraulic
        - Indus civilization weights standardization
        - Indus seals trade Mesopotamia
        - Harappan craft production beads
        - Indus civilization climate decline monsoon
        - Mohenjo-daro conservation salt
      ur:
        max_sources: 25
        must_match: \bur\b|urim|ur iii|ur-nammu|ur-namma|ziggurat|royal cemetery|sumer|mesopotamia
        queries:
        - Royal Cemetery of Ur
        - Ziggurat of Ur
        - Ur III administration labor
        - Ur III state economy workers rations
        - Mesopotamian baked brick bitumen
        - Sumerian construction mudbrick
        - Tell el-Muqayyar
        - Ur excavations Woolley
        - Neo-Sumerian Ur III texts
        - Mesopotamia irrigation canals third millennium
      qin_mausoleum:
        max_sources: 30
        must_match: \bqin\b|terracotta|lishan|shihuang|shi huang|first emperor
