# DeCode evidence sources.
#
# Every entry has: id, site, type, title, url, license, author (+ optional year, period, keep_regex, enabled, note).
# site is a contract id: giza | uruk | mohenjo | qin
# type is a contract source_type: excavation_report | primary_text | scholarship | reference | dataset
# year is the publication year. Leave it off for living web pages (Wikipedia, Wikidata); ingest fills in the retrieval year.
#
# Before anything here is fetched, ingest runs it through the stage 1 gate (data/source_check.py on top of
# Chad's SourceRegistry): known valid -> ingested, known invalid -> skipped, unknown -> checked now
# (license, access, robots.txt). The answer is saved in sources.resolved.yaml.
# `fetch` says how ingest.py gets the text:
#   wikipedia        plain-text extract via the MediaWiki API (follows redirects, falls back to search)
#   archive_search   Internet Archive advanced search -> first hit with an OCR text file (<id>_djvu.txt); `prefer` pins identifiers
#   gutenberg_search Gutendex search -> plain-text ebook
#   url              direct download of an html or pdf
#   wikidata_place   Wikidata entity (CC0) + its Pleiades place record (P1584, CC BY)
# `keep_regex` keeps only paragraphs (and their neighbours) that mention the site. Use it for general or multi-site works.
# `enabled: false` means listed but NOT ingested (license forbids reuse, or it's unusable for English retrieval).
# The gate skips them and records the note as the reason.
#
# Search-based entries resolve to concrete URLs at ingest time. `python -m data.ingest` writes every
# source actually used (with its real url and license) to sources.resolved.yaml.
#
# The `discovery` block adds open-access journal articles from OpenAlex, per site, until each site has
# 30-60 sources. Their per-work license comes from OpenAlex (best_oa_location.license).

