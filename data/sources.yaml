- id: place_mohenjo_daro
  site: mohenjo
  type: reference
  title: 'Mohenjo-daro: Wikidata + Pleiades place record'
  url: https://www.wikidata.org/w/index.php?search=Mohenjo-daro
  license: Wikidata CC0 1.0; Pleiades CC BY 3.0
  fetch:
    kind: wikidata_place
    label: Mohenjo-daro
  author: Wikidata and Pleiades contributors
discovery:
  openalex:
    licenses_allowed:
    - cc-by
    - cc-by-sa
    - cc0
    - public-domain
    - cc-by-nc
    - cc-by-nc-sa
    - cc-by-nd
    - cc-by-nc-nd
    note: Only works whose best open-access location has one of these licenses are ingested. The license is recorded per work. NC/ND works are fine for this non-commercial project; drop
      them from the list for commercial use.
    queries:
      giza:
        max_sources: 22
        must_match: giza|khufu|cheops|khafre|menkaure|great pyramid|old kingdom|pyramid
        queries:
        - Giza pyramids construction
        - Great Pyramid Khufu
        - Giza plateau archaeology
        - Wadi al-Jarf papyri harbour
        - Egyptian pyramid ramp transport blocks
        - Nile branch pyramids Ahramat
        - Old Kingdom quarry limestone Tura
        - Heit el-Ghurab pyramid workers
        - sledge wet sand friction ancient Egypt
        - Great Pyramid orientation cardinal
      uruk:
        max_sources: 25
        must_match: uruk|warka|erech|eanna|proto-cuneiform|beveled rim|bevelled rim|uruk period|uruk expansion
        queries:
        - Uruk Eanna precinct architecture
        - Uruk period urbanization
        - White Temple Anu ziggurat Uruk
        - beveled rim bowls rations
        - proto-cuneiform administration Uruk
        - cone mosaic Uruk temple
        - Uruk expansion trade
        - Warka excavations
        - Uruk period labor organization
        - southern Mesopotamia canals fourth millennium
      mohenjo:
        max_sources: 30
        must_match: mohenjo|moenjo|harappa|indus
        queries:
        - Mohenjo-daro
        - Indus civilization water management drainage
        - Harappan urban planning
        - Indus Valley baked brick
        - Harappan wells hydraulic
        - Indus civilization weights standardization
        - Indus seals trade Mesopotamia
        - Harappan craft production beads
        - Indus civilization climate decline monsoon
        - Mohenjo-daro conservation salt
      qin:
        max_sources: 30
        must_match: \bqin\b|great wall|meng tian|straight road|zhidao|rammed earth|lingqu|zhengguo
        queries:
        - Qin Great Wall rammed earth
        - Qin Straight Road Zhidao
        - Qin dynasty road network
        - Great Wall construction labor
        - rammed earth hangtu construction ancient China
        - Qin dynasty standardization axle weights measures
        - Lingqu canal Qin
        - Zhengguo canal irrigation
        - Qin bamboo slips labor statutes
        - Great Wall Warring States walls
