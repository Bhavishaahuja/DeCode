  type: excavation_report
  title: Further Excavations at Mohenjo-daro 1927-31 (Mackay, 1938)
  url: https://archive.org/search?query=title:(further+excavations+mohenjo-daro)+AND+creator:(mackay)
  license: In copyright in the US until 2034 (published 1938, URAA-restored); UK public domain (Mackay died 1943)
  fetch:
    kind: archive_search
    query: title:(further excavations mohenjo-daro) AND creator:(mackay)
    prefer:
    - furtherexcavationsatmohenjodaro192731vol2ejhmackay_191_N
  year: 1938
  enabled: false
  note: Public domain in the UK/India but not in the US. Enable only if your deployment is outside the US.
  author: Ernest J. H. Mackay
- id: cdli_uruk
  site: uruk
  type: dataset
  title: 'CDLI catalogue: archaic texts excavated at Uruk (proto-cuneiform)'
  url: https://cdli.mpiwg-berlin.mpg.de/search?provenience=Uruk
  license: CC0 1.0 (CDLI data)
  enabled: false
  note: CC0 metadata, but the transliterations are not English prose and there is no bulk text export we can chunk. Listed so the registry records the decision.
  author: Cuneiform Digital Library Initiative
- id: oracc_uruk
  site: uruk
  type: primary_text
  title: ORACC royal inscriptions mentioning Uruk
  url: https://oracc.museum.upenn.edu/
  license: CC BY-SA 3.0 (ORACC)
  enabled: false
  note: Add specific ORACC project/text URLs as kind:url entries once confirmed; the corpus-level JSON is large (check size before download).
  author: ORACC
- id: shiji_ch6_zh
  site: qin
  type: primary_text
  title: Shiji ch. 6 and ch. 88 (Basic Annals of Qin Shi Huang, Biography of Meng Tian), Chinese text, Chinese Text Project
  url: https://ctext.org/shiji/qin-shi-huang-ben-ji
  license: Public domain text (Han dynasty); ctext.org terms forbid bulk scraping, use their API
  period: Western Han (206 BCE-9 CE) account
  enabled: false
  note: Chinese only, so bge-small-en can't retrieve it well. Enable with a multilingual embedder (e.g. BAAI/bge-m3) via the ctext API.
  author: Sima Qian
- id: chavannes1897_t2
  site: qin
  type: primary_text
  title: Les Mémoires historiques de Se-ma Ts'ien, tome II (tr. Chavannes, 1897), ch. 6
  url: https://archive.org/search?query=title:(memoires+historiques)+AND+creator:(chavannes)+AND+year:[1895+TO+1899]
  license: Public domain (published 1897; author died 1918)
  fetch:
    kind: archive_search
    query: title:(memoires historiques) AND creator:(chavannes) AND year:[1895 TO 1899]
  year: 1897
  period: Western Han (206 BCE-9 CE) account
  keep_regex: grande muraille|mong t'ien|meng t'ien|route|chemin|canal
  enabled: false
  note: French translation, public domain. Disabled because the English embedder won't handle French; enable if you switch to bge-m3.
  author: Sima Qian (tr. Edouard Chavannes)
- id: open_context
  site: giza
  type: dataset
  title: Open Context (search for all four sites)
  url: https://opencontext.org/
  license: CC BY 4.0 / CC0 per project
  enabled: false
  note: No published Open Context projects for these four sites found by the time of writing. Add project URLs here if one appears.
  author: Open Context
- id: tdar
  site: mohenjo
  type: dataset
  title: tDAR (the Digital Archaeological Record)
  url: https://core.tdar.org/
  license: tDAR user agreement (login required; per-resource access)
  enabled: false
  note: Downloads need an account and acceptance of the user agreement. Not automated.
  author: tDAR
- id: ads
  site: uruk
  type: dataset
  title: Archaeology Data Service (ADS)
  url: https://archaeologydataservice.ac.uk/
  license: ADS terms of use / CC BY 4.0 per collection
