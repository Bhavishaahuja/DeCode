# Canonical system_tags for Stratum: the 9 shared systems from CLAUDE.md.
# These ids match claims/taxonomy.yaml exactly. Dev 2's taxonomy adds plain-language
# definitions and MasterFormat / Uniclass headings on top; this file only holds the tagging rules.
#
# Tagging rule (data/tagging.py): a passage gets a tag when it matches
#   >= 1 "strong" pattern, OR >= 2 distinct "weak" patterns.
# Patterns are case-insensitive Python regexes, matched on word boundaries.
# "aliases" are accepted by search_evidence(system=...) and mapped to the canonical id.
# The old pre-contract ids (materials, logistics_supply, surveying_layout, structural_design,
# administration_records) are kept as aliases so old queries still work.
#
# Dev 2's must-have systems (claims/common.py REQUIRED_SYSTEMS):
#   transport_lifting, materials_supply, workforce, water_sanitation, quality_control

