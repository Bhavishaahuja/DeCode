# Canonical system_tags for Stratum: the 9 engineering systems.
# Dev 1 tags passages with these ids. Dev 2's claims/taxonomy.yaml should reuse the same ids
# (it adds plain-language definitions and CSI MasterFormat / Uniclass headings on top).
#
# Tagging rule (data/tagging.py): a passage gets a tag when it matches
#   >= 1 "strong" pattern, OR >= 2 distinct "weak" patterns.
# Patterns are case-insensitive Python regexes, matched on word boundaries.
# "aliases" are accepted by search_evidence(system=...) and mapped to the canonical id.
# Dev 2's five must-have demo systems: transport_lifting, materials, workforce,
# water_sanitation, quality_control.

systems:
