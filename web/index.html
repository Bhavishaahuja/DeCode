<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE3;--band:#EFE6D4;--card:#FFFBF3;--ink:#1F1A14;--muted:#6B5F4E;--line:#DDD2BD;
  --giza:#A85B1B;--uruk:#2B4A93;--mohenjo:#A23B28;--qin:#2C6E52;
  --giza-t:#EED9BE;--uruk-t:#D3DBEE;--mohenjo-t:#EFD3C9;--qin-t:#D5E4DA;
  --soil:#D9CCB2;--shadow:0 1px 0 rgba(31,26,20,.06),0 8px 24px -12px rgba(31,26,20,.18);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1612;--band:#221D17;--card:#2A241D;--ink:#F2EADB;--muted:#B3A58E;--line:#3E352A;
    --giza:#D98E4F;--uruk:#8AA4E6;--mohenjo:#E07C66;--qin:#73B995;
    --giza-t:#3A2A1B;--uruk-t:#1F2742;--mohenjo-t:#3B2320;--qin-t:#1E3329;--soil:#3A3226;
    --shadow:0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1612;--band:#221D17;--card:#2A241D;--ink:#F2EADB;--muted:#B3A58E;--line:#3E352A;
  --giza:#D98E4F;--uruk:#8AA4E6;--mohenjo:#E07C66;--qin:#73B995;
  --giza-t:#3A2A1B;--uruk-t:#1F2742;--mohenjo-t:#3B2320;--qin-t:#1E3329;--soil:#3A3226;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--c,var(--ink));outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.01em}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:22px}
.logo{display:grid;gap:3px;width:26px}
.logo i{display:block;height:5px;border-radius:3px}
.logo i:nth-child(1){background:var(--qin);width:80%}
.logo i:nth-child(2){background:var(--mohenjo);width:100%}
.logo i:nth-child(3){background:var(--giza);width:90%}
.logo i:nth-child(4){background:var(--uruk);width:100%}
.top nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.navlink{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px}
.navlink:hover{background:var(--band)}
.navlink[aria-current="page"]{background:var(--ink);color:var(--bg)}
.theme-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}

/* buttons, badges */
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.pill.ghost{background:transparent;color:var(--ink)}
.pill.site{background:var(--c);border-color:var(--c);color:#fff}
.pill:hover{filter:brightness(1.08)}
.pill:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap;vertical-align:middle}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.attested{background:var(--ink);color:var(--bg)}
.badge.debated{border-style:dashed}
.badge.inferred{border-style:dotted;border-width:2px}
.badge.inferred::before{background:transparent;border:1.5px dotted currentColor;width:5px;height:5px}
.badge.debated::before{background:transparent;border:1.5px solid currentColor;width:5px;height:5px}
.badge.assumed{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.badge.assumed::before{display:none}
.badge.attested-tag{border-color:var(--ink)}
.badge.attested-tag::before{display:none}

/* home */
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(52px,8vw,92px);font-weight:700;letter-spacing:-.03em}
.tagline{font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);font-weight:400;line-height:1.25;margin-top:14px;max-width:18ch;padding-left:clamp(48px,9vw,140px)}
.summary{margin-top:22px;color:var(--muted);max-width:52ch;font-size:18px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.dig{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.dig-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 10px}
.dig svg{display:block;width:100%;height:auto}
.dig a{cursor:pointer}
.dig a .layer{transition:transform .25s ease}
.dig a:hover .layer,.dig a:focus .layer{transform:translateX(6px)}
.dig a:focus{outline:none}
.dig a:focus-visible .layer-hit{stroke:var(--ink);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
  .settle{animation:settle .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes settle{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
}
.band{background:var(--band);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.section{padding:64px 0}
.section h2{font-size:clamp(30px,4vw,42px)}
.section .lede{color:var(--muted);margin-top:8px;max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}
.site-card{--c:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s}
.site-card:hover{transform:translateY(-4px);border-color:var(--c)}
.site-card .art{background:var(--t);height:180px;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.site-card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.site-card h3{font-size:26px}
.site-card .go{margin-top:auto;padding-top:10px;color:var(--c);font-weight:600;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.step .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.step h3{font-size:28px;margin:6px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;align-items:center}
.legend span.desc{color:var(--muted);font-size:15px;margin-left:4px}
footer{padding:36px 0 48px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* inner chrome */
.crumbs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;flex:none}
.back:hover{border-color:var(--c)}
.crumbs ol{list-style:none;display:flex;gap:8px;margin:0;padding:0;font-size:15px;flex-wrap:wrap}
.crumbs li+li::before{content:"/";margin-right:8px;color:var(--muted)}
.crumbs li a{text-decoration:none;color:var(--muted)}
.crumbs li a:hover{color:var(--ink);text-decoration:underline}
.modes{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.modes a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.modes a:hover{background:var(--band)}
.modes a[aria-current="page"]{background:var(--c);color:#fff}

/* site page */
.site-hero{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:start;padding-top:10px;padding-bottom:36px}
.site-hero h1{font-size:clamp(56px,9vw,104px);font-weight:700;letter-spacing:-.03em;color:var(--c)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{font-family:var(--mono);font-size:13px;background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px}
.brief{font-family:var(--serif);font-size:21px;line-height:1.5;margin-top:22px;max-width:36ch}
.dyk{margin-top:24px;background:var(--t);border-radius:20px;padding:18px 20px;display:grid;gap:8px;max-width:46ch}
.dyk strong{font-family:var(--serif);font-size:18px;font-weight:600}
.map{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px;box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto;border-radius:18px}
.map .cap{display:flex;justify-content:space-between;padding:10px 6px 2px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:56px}
.opt{text-decoration:none;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:10px;min-height:250px;transition:border-color .2s,transform .2s}
.opt:hover{border-color:var(--c);transform:translateY(-3px)}
.opt .ic{width:56px;height:56px;border-radius:18px;background:var(--t);display:grid;place-items:center;color:var(--c)}
.opt h3{font-size:28px}
.opt p{color:var(--muted)}
.opt .go{margin-top:auto;color:var(--c);font-weight:600}
.others{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:56px}
.others a{text-decoration:none;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:500;display:flex;gap:8px;align-items:center}
.others a:hover{border-color:currentColor}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* page titles */
.ptitle{padding-top:6px;padding-bottom:22px}
.ptitle h1{font-size:clamp(36px,5vw,54px)}
.ptitle p{color:var(--muted);margin-top:8px;max-width:62ch}

/* chat */
.chat{display:grid;grid-template-columns:1fr 300px;gap:22px;padding-bottom:56px;align-items:start}
.thread{background:var(--card);border:1px solid var(--line);border-radius:26px;display:flex;flex-direction:column;height:min(78vh,760px);min-height:520px;overflow:hidden;position:sticky;top:84px}
.msgs{flex:1;min-height:0;padding:22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.empty{margin:auto;text-align:center;max-width:44ch;display:grid;gap:14px;justify-items:center;padding:20px 0}
.empty h2{font-size:30px}
.sugs{display:flex;flex-direction:column;gap:8px;width:100%}
.sug{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.sug:hover{border-color:var(--c)}
.sug .mono{color:var(--muted)}
.msg.user{align-self:flex-end;background:var(--c);color:#fff;padding:11px 16px;border-radius:20px 20px 6px 20px;max-width:78%}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);padding:16px 18px;border-radius:20px 20px 20px 6px;max-width:92%;display:grid;gap:12px}
.msg.bot .ans{font-size:17px}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.num{background:var(--t);border-radius:12px;padding:8px 12px;display:grid;line-height:1.2}
.num b{font-family:var(--serif);font-size:20px}
.num span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cites{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.cite{font-size:14px;display:flex;gap:8px;align-items:baseline}
.cite .k{font-family:var(--mono);font-size:12px;color:var(--c);flex:none}
.ans p+p,.ans ul{margin-top:8px}
.ans ul{padding-left:20px;display:grid;gap:4px}
.ans code{font-family:var(--mono);font-size:.9em}
sup.fn{font-family:var(--mono);font-size:11px;color:var(--c);margin-left:1px}
.cite a{color:inherit;text-decoration-color:var(--line)}
.cite .tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
.critic.flagged{border-left-color:#c0392b}
.critic ul{margin:6px 0 0;padding-left:18px}
.rows{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.row{display:grid;gap:3px;font-size:14px}
.row .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row span.muted{font-size:13px}
.critic{font-size:14px;background:var(--card);border-radius:12px;padding:8px 12px;border-left:3px solid var(--c)}
.bot-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--card)}
.composer input{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:12px 18px;font:inherit;min-width:0}
.composer input:focus{outline:none;border-color:var(--c)}
.side{display:grid;gap:18px;align-content:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.panel h3{font-size:20px;margin-bottom:10px}
.agents{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:a}
.agents li{counter-increment:a;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;font-size:15px;transition:background .2s}
.agents li::before{content:counter(a);font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.agents li small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.agents li.on{background:var(--t)}
.agents li.on::before{border-color:var(--c);background:var(--c);color:#fff}
.agents li.done::before{border-color:var(--c);color:var(--c)}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live i{background:#3a9d5d}
.thinking{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:15px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--c);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

/* build */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px}
.tab{border:0;background:none;padding:12px 16px;cursor:pointer;font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--c)}
.tab:hover{color:var(--ink)}
.build-body{padding-bottom:60px}
.sys-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sys{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:16px;cursor:pointer;display:grid;gap:8px;min-height:108px}
.sys:hover{border-color:var(--c)}
.sys[aria-pressed="true"]{border-color:var(--c);background:var(--t)}
.sys .top-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sys b{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.2}
.sys.pending b{color:var(--muted)}
.teardown{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
.detail{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;position:sticky;top:84px;display:grid;gap:16px}
.detail h3{font-size:26px}
.then-now{display:grid;gap:10px}
.then-now div{border-radius:14px;padding:12px 14px;background:var(--bg);border:1px solid var(--line)}
.then-now .lbl{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.then-now .lesson{background:var(--t);border-color:transparent}
.then-now .lesson p{font-family:var(--serif);font-size:19px}
.tl{list-style:none;margin:0;padding:0;position:relative;max-width:760px}
.tl::before{content:"";position:absolute;left:111px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:100px 1fr;gap:28px;padding:10px 0 22px;position:relative}
.tl li::after{content:"";position:absolute;left:105px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--c)}
.tl .yr{font-family:var(--mono);font-size:14px;text-align:right;padding-top:8px}
.tl .ev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:grid;gap:6px}
.tl .ev b{font-family:var(--serif);font-weight:600;font-size:19px}
.est{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.est-shared{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:grid;gap:6px}
.field label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:500;font-size:15px}
.field input{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-family:var(--mono);width:100%}
.field input:focus{outline:none;border-color:var(--c)}
.era{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:14px}
.era h3{font-size:24px}
.era .out{background:var(--t);border-radius:16px;padding:14px 16px;display:flex;gap:26px;flex-wrap:wrap}
.era .out b{font-family:var(--serif);font-size:34px;display:block;line-height:1}
.era .out span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px}
.race{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.stackbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:14px;justify-items:center}
.stackbox h3{font-size:22px;justify-self:start}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;width:100%;height:230px;justify-content:flex-start}
.stack i{display:block;height:12px;border-radius:4px;background:var(--line);transition:background .15s}
.stack i.f{background:var(--c)}
.stackbox .clock{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1}
.stackbox .clock small{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.race-ctrl{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.race-ctrl input[type=range]{flex:1;min-width:180px;accent-color:var(--c)}
.changes{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* decode */
.pipe{list-style:none;margin:0 0 28px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pipe li{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:6px}
.pipe .n{font-family:var(--mono);font-size:13px;color:var(--c)}
.pipe b{font-family:var(--serif);font-size:21px;font-weight:600}
.pipe p{color:var(--muted);font-size:15px}
.decode{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;padding-bottom:60px;align-items:start}
.source{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:12px}
.source .title{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.25}
.passage{background:var(--bg);border-left:3px solid var(--c);border-radius:0 12px 12px 0;padding:12px 14px;font-family:var(--serif);font-size:17px}
.queue{display:grid;gap:12px}
.claim{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.claim.approved{border-color:var(--c)}
.claim.sent{opacity:.7}
.claim-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.claim-h b{font-family:var(--serif);font-weight:600;font-size:18px}
.claim .acts{display:flex;gap:8px;flex-wrap:wrap}
.claim .acts .pill{padding:8px 14px;font-size:14px}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--c);transition:width .3s}

@media (max-width:980px){
  .hero-grid,.site-hero,.teardown,.decode,.chat{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
  .detail{position:static}
  .pipe{grid-template-columns:repeat(2,1fr)}
  .side{grid-template-columns:1fr 1fr}
}
@media (max-width:680px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  .cards,.steps,.options,.sys-grid,.est,.est-shared,.race,.changes,.pipe,.side{grid-template-columns:1fr}
  .modes{margin-left:0;width:100%;overflow-x:auto}
  .modes a{flex:1;text-align:center;padding:8px 10px}
  .top nav .navlink.hide-sm{display:none}
  .tl::before{left:71px}.tl li{grid-template-columns:60px 1fr;gap:26px}.tl li::after{left:65px}
  .opt{min-height:0}
  .thread{height:72vh;position:static}
  .hero{padding-top:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.site-card .art{position:relative;overflow:hidden}
.site-card .art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.site-card .art.has3d svg{visibility:hidden}

function md(text){
  // small, safe markdown: escape first, then bold, italics, code, bullets and [^n] footnotes
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<i>$2</i>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[\^(\d+)\]/g,'<sup class="fn">$1</sup>');
  const out=[]; let list=null;
  for(const raw of String(text||"").split("\n")){
    const line=raw.trim();
    const bullet=line.match(/^[-*]\s+(.*)$/);
    if(bullet){ (list ||= []).push(`<li>${inline(bullet[1])}</li>`); continue; }
    if(list){ out.push(`<ul>${list.join("")}</ul>`); list=null; }
    if(line) out.push(`<p>${inline(line)}</p>`);
  }
  if(list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}

const SYS_LABEL = id => (SYSTEMS.find(x=>x[0]===SYS_MAP[id])||[id,id])[1];
function fromContract(d){
  // turns a Contract 4 response from agents/server.py into a chat message
  if(d.clarifying_question) return {text:d.clarifying_question,html:md(d.clarifying_question),cites:[],grade:null,demo:false,trace:d.trace||[]};
  const nums=[]; const est=(d.cards||[]).find(c=>c.type==="estimator");
  if(est){
    const a=est.result.ancient, m=est.result.modern, p=est.preset;
    nums.push({v:`${fmt(a.years)} yrs`,l:`ancient, ${fmt(a.people)} people`},{v:`${fmt(m.years)} yrs`,l:`modern, ${fmt(m.people)} people`},{v:fmt(p.quantity),l:`${p.unit} (${p.quantity_tag})`});
  }
  const cites=(d.citations||[]).map(c=>({text:[c.title,c.locator].filter(Boolean).join(", ")||c.source_id,url:c.url,grade:c.grade,reviewed:!!c.claim_id}));
  const rank={attested:0,debated:1,inferred:2}; let grade=null;
  cites.forEach(c=>{ if(c.grade && (grade===null || rank[c.grade]>rank[grade])) grade=c.grade; }); // show the weakest grade the answer leans on
  const rows=[];
  (d.cards||[]).filter(c=>c.type==="teardown").forEach(card=>card.rows.slice(0,4).forEach(r=>rows.push({system:`${SITES[card.site]?short(SITES[card.site]):card.site}, ${SYS_LABEL(r.system)}`,grade:r.grade,ancient:r.ancient,modern:r.modern,lesson:r.lesson})));
  const c=d.critic||{passed:true,flags:[],retries:0};
  const critic=c.passed?(c.retries?"Passed after one rewrite. Every number and cited sentence was checked.":"Passed. Every number and cited sentence was checked against the tools and sources."):"The critic flagged this answer.";
  return {text:d.answer_md,html:md(d.answer_md),nums,cites,critic,flagged:!c.passed,flags:c.passed?[]:(c.flags||[]),grade,rows:rows.slice(0,6),trace:d.trace||[],demo:false};
}
let apiLive=null;
async function pingAPI(){
  if(apiLive===true) return true;
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),API_TIMEOUT);
  try{const r=await fetch(`${API_BASE}/health`,{signal:ctl.signal});apiLive=r.ok}catch(e){apiLive=false}
  clearTimeout(t); return apiLive;
}
function paintStatus(){
  const el=$("#chatStatus"); const f=$("#apiStatus");
  const txt=(apiLive?"Chat API connected":"Demo mode, chat API offline")+(liveData?". Live data from the tools API":"");
  if(el){el.className="status"+(apiLive?" live":"");el.innerHTML=`<i></i>${txt}`}
  if(f) f.textContent=apiLive===null?"":txt;
}
let busy=false;
function historyFor(k){
  // the last few finished turns, in the shape the chat API wants
  const turns=[];
  for(const m of chats[k]){
    if(m.pending) continue;
    if(m.role==="user") turns.push({role:"user",content:m.text});
    else if(m.text && !m.demo) turns.push({role:"assistant",content:m.text});
  }
  return turns.slice(-6);
}
async function send(k,q){
  q=q.trim(); if(!q||busy) return; busy=true;
  const history=historyFor(k);
  chats[k].push({role:"user",text:q}); const pend={role:"bot",pending:true,stage:"Routing"}; chats[k].push(pend);
  const draw=()=>{const msgs=$("#msgs"); if(!msgs) return; msgs.innerHTML=renderMsgs(k);msgs.scrollTop=msgs.scrollHeight};
  draw(); $("#q").value="";
  const lights=cls=>document.querySelectorAll("#agents li").forEach((l,j)=>l.className=cls(j));
  const started=performance.now();
  let result=null;
  const apiP=pingAPI().then(ok=>ok?askAPI(k,q,history):null).then(r=>{result=r||{offline:true};return r});
  const pace=matchMedia("(prefers-reduced-motion: reduce)").matches?60:900;
  let i=0;
  while(result===null){ // keep the steps moving until the answer arrives
    const step=i%AGENTS.length;
    lights(j=>j<step?"done":j===step?"on":"");
    pend.stage=`${AGENTS[step][0]}: ${AGENTS[step][1].toLowerCase()} (${Math.round((performance.now()-started)/1000)} s)`; draw();
    await Promise.race([apiP,new Promise(r=>setTimeout(r,i<AGENTS.length?pace/2:pace))]);
    i++;
  }
  const live=await apiP; const secs=Math.round((performance.now()-started)/100)/10;
  if(live && !live.error && live.text){
    // light up only the layers that really ran
    const ran=new Set((live.trace||[]).map(step=>TRACE_TO_AGENT[step.layer]).filter(x=>x!==undefined));
    lights(j=>ran.has(j)?"done":"");
    Object.assign(pend,{pending:false,secs},live);
  } else {
    lights(()=>"done");
    Object.assign(pend,{pending:false},demoAnswer(k,q),live&&live.error?{apiError:live.error}:{});
  }
  draw(); paintStatus(); busy=false;
}

/* live data from the tools API: presets and verified claims */
const SYS_MAP = {site_setout:"site",materials_supply:"materials",transport_lifting:"transport",water_sanitation:"water",structure_form:"structure",finishes:"finishes",workforce:"workforce",quality_control:"quality",project_controls:"controls"};
let liveData=false;
async function getJSON(url,opts){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),4000);
  try{const r=await fetch(url,{...opts,signal:ctl.signal}); clearTimeout(t); if(!r.ok) return null; return {body:await r.json(),headers:r.headers}}
  catch(e){clearTimeout(t);return null}
}
async function loadLiveData(){
  const presets=await getJSON(`${TOOLS_BASE}/tools/presets`);
  if(!presets) return; // tools API offline, so keep the built-in demo data
  for(const k of ORDER){
    const p=presets.body[k]; if(!p) continue;
    const s=SITES[k];
    s.unit=p.unit; s.totalTag=p.quantity_tag; s.presetDraft=!!p.draft;
    s.est={total:p.quantity,days:p.ancient.days_per_year,aC:p.ancient.crews,aS:p.ancient.crew_size,aR:p.ancient.rate_per_crew_day,mC:p.modern.crews,mS:p.modern.crew_size,mR:p.modern.rate_per_crew_day};
    estState[k]={...s.est}; s.livePreset=true;
  }
  const rank={attested:0,debated:1,inferred:2};
  for(const k of ORDER){
    const got=await getJSON(`${TOOLS_BASE}/tools/claims`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({site:k})});
    if(!got || got.headers.get("X-DeCode-Fallback")) continue; // no verified claims yet, keep the demo rows
    const claims=got.body.claims||[]; const best={};
    for(const c of claims){
      const key=SYS_MAP[c.system]; if(!key) continue;
      if(!best[key] || rank[c.grade]<rank[best[key].grade]) best[key]=c;
    }
    const systems={};
    for(const [key,c] of Object.entries(best)){
      const src=(c.sources||[])[0]||{};
      systems[key]={a:esc(c.statement),m:esc(c.modern_equivalent),l:esc(c.lesson),g:c.grade,src:[src.title,src.locator].filter(Boolean).join(", "),id:c.claim_id,n:claims.filter(x=>x.system===c.system).length};
    }
    if(Object.keys(systems).length){ SITES[k].systems=systems; SITES[k].liveClaims=true; }
  }
  liveData=true;
  const y=scrollY; route(); scrollTo(0,y);
}

    const keys=SYSTEMS.map(x=>x[0]); pickSys[k] ||= keys.find(x=>s.systems[x]);
    const sel=pickSys[k], c=s.systems[sel], name=SYSTEMS.find(x=>x[0]===sel)[1];
    return `<div class="teardown"><div class="sys-grid">${SYSTEMS.map(([id,n],i)=>{const d=s.systems[id];return `<button class="sys ${d?"":"pending"}" data-sys="${id}" aria-pressed="${id===sel}"><span class="top-row"><span class="mono muted">System ${i+1}</span>${d?badge(d.g):`<span class="mono muted">not yet</span>`}</span><b>${n}</b></button>`}).join("")}</div>
      <div class="detail">${c?`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3>${name}</h3>${badge(c.g)}</div>
        <div class="then-now"><div><span class="lbl">Then</span><p>${c.a}</p></div><div><span class="lbl">Now</span><p>${c.m}</p></div><div class="lesson"><span class="lbl">Lesson</span><p>${c.l}</p></div></div>
        ${c.src?`<p class="mono muted" style="font-size:12px">Source: ${esc(c.src)}${c.n>1?`. ${c.n} reviewed claims for this system`:""}</p>`:""}
        <a class="pill ghost" href="#/site/${k}/decode">Decode the source</a>`
        :`<h3>${name}</h3><p class="muted">No reviewed claims for this system yet. Claims appear here once a person approves them.</p><a class="pill site" href="#/site/${k}/decode">Help review claims</a>`}</div></div>`;
  }
  if(t==="timeline") return `<ol class="tl">${s.timeline.map(([y,e,g])=>`<li><span class="yr">${y}</span><div class="ev"><b>${e}</b><span>${badge(g)}</span></div></li>`).join("")}</ol>`;
  if(t==="estimator"){
    const e=estState[k], r=estimate(e);
    const f=(key,l,tag)=>`<div class="field"><label for="f-${key}">${l}<span class="badge ${tag==="attested"?"attested-tag":"assumed"}">${tag}</span></label><input id="f-${key}" type="number" min="0" step="any" data-est="${key}" value="${e[key]}"></div>`;
    return `<div class="est">
      <div class="est-shared">${f("total",`Total ${s.unit}`,s.totalTag)}${f("days","Working days per year","assumed")}</div>
      <div class="era"><h3>Ancient crew</h3>${f("aC","Number of crews","assumed")}${f("aS","People per crew","assumed")}${f("aR",`${cap(s.unit)} per crew per day`,"assumed")}
        <div class="out"><div><b id="o-aY">${fmt(r.aY)}</b><span>years</span></div><div><b id="o-aP">${fmt(r.aP)}</b><span>people</span></div></div></div>
      <div class="era"><h3>Modern crew</h3>${f("mC","Number of crews","assumed")}${f("mS","People per crew","assumed")}${f("mR",`${cap(s.unit)} per crew per day`,"assumed")}
        <div class="out"><div><b id="o-mY">${fmt(r.mY)}</b><span>years</span></div><div><b id="o-mP">${fmt(r.mP)}</b><span>people</span></div></div></div>
      <p class="note" style="grid-column:1/-1">${s.livePreset?`Loaded from the DeCode tools preset${s.presetDraft?" (a draft preset, every value is an assumption)":""}, the same numbers the chat uses. Crew rates are assumptions, so change them and watch the answer move.`:(k==="giza"?"Block count comes from the project data. Crew rates are assumptions, so change them and watch the answer move.":"Demo inputs. Start the tools API on port 8001 to load the real presets.")}</p>
    </div>`;
  }
  // build it now
  const r=estimate(estState[k]);
  const ch=Object.entries(s.systems).slice(0,3);
  return `<div class="race">
    <div class="stackbox"><h3>Ancient crew, ${fmt(r.aP)} people</h3><div class="stack" id="stA">${stackRows(k)}</div><div class="clock" id="cA">0<small>of ${fmt(r.aY)} years</small></div></div>
    <div class="stackbox"><h3>Modern crew, ${fmt(r.mP)} people</h3><div class="stack" id="stM">${stackRows(k)}</div><div class="clock" id="cM">0<small>of ${fmt(r.mY)} years</small></div></div>
    <div class="race-ctrl"><button class="pill site" id="play">Start the build</button><input type="range" id="yr" min="0" max="${Math.ceil(r.aY*10)/10}" step="0.1" value="0" aria-label="Year"><span class="mono" id="yrLbl">Year 0</span></div>
    <div class="changes">${ch.map(([id,c])=>`<div class="era"><span class="mono muted">${SYSTEMS.find(x=>x[0]===id)[1]}</span><p>${c.m}</p><span>${badge(c.g)}</span></div>`).join("")}</div>
    <p class="note" style="grid-column:1/-1">Times come from the crew estimator. Change the inputs there to rerun the race.</p>
  </div>`;
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function stackRows(k){
  const shape=SITES[k].shape, n=16; let o="";
  for(let i=0;i<n;i++){
    let w;
    if(shape==="pyramid") w=100-(i/(n-1))*88;
    else if(shape==="ziggurat") w=[100,76,52][Math.min(2,Math.floor(i/(n/3)))];
    else if(shape==="bath") w=i<4?100:(i<12?[100,100][0]:100);
    else w=100;
    if(shape==="wall") w=100;
    o+=`<i style="width:${w}%;${shape==="wall"&&i>9?"opacity:0":""}${shape==="bath"&&i>5?";opacity:0":""}"></i>`;
  }
  return o;
}
function paintRace(k,y){
  const r=estimate(estState[k]);
  const fill=(id,frac)=>{const rows=[...document.querySelectorAll(`#${id} i`)].filter(x=>x.style.opacity!=="0");const f=Math.round(Math.min(1,frac)*rows.length);rows.forEach((x,i)=>x.classList.toggle("f",i<f))};
  fill("stA",r.aY?y/r.aY:0); fill("stM",r.mY?y/r.mY:0);
  $("#cA").innerHTML=`${fmt(Math.min(y,r.aY))}<small>of ${fmt(r.aY)} years</small>`;
  $("#cM").innerHTML=`${y>=r.mY?"Done":fmt(y)}<small>${y>=r.mY?`in ${fmt(r.mY)} years`:`of ${fmt(r.mY)} years`}</small>`;
  $("#yrLbl").textContent=`Year ${fmt(y)}`;
}

/* decode */
function decodeView(k){
  const s=SITES[k];
  const claims=Object.entries(s.systems).map(([id,c])=>({id,sys:SYSTEMS.find(x=>x[0]===id)[1],...c}));
  reviewState[k] ||= {};
  const done=claims.filter(c=>reviewState[k][c.id]).length;
  const src=s.source;
  return `<div style="${siteStyle(k)}">${chrome(k,"decode")}
  <div class="wrap ptitle"><h1>Decode ${esc(short(s))}</h1><p>Every answer starts with something the builders or later scholars left behind: an artifact, a tablet, a scripture or an old survey. Here is how we decode it back into a claim you can trust.</p></div>
  <div class="wrap"><ol class="pipe">
    <li><span class="n">Step 1</span><b>Find sources</b><p>Artifacts, tablets, scriptures and surveys we are allowed to use.</p></li>
    <li><span class="n">Step 2</span><b>Read them</b><p>AI picks out the lines and marks that say how something was built.</p></li>
    <li><span class="n">Step 3</span><b>Grade claims</b><p>Each passage becomes a short claim marked attested, debated or inferred.</p></li>
    <li><span class="n">Step 4</span><b>Human review</b><p>A person approves the claim or sends it back. Only approved claims reach the chat.</p></li>
  </ol></div>
  <div class="wrap decode">
    <div class="source">
      <span class="mono muted">Example source</span>
      ${src?`<p class="title">${src.t}</p><p>${src.a}, ${src.y}, ${src.p}</p><p><span class="badge attested-tag">${src.lic}</span></p>
        <div class="passage">${src.pass}</div>
        <div class="then-now"><div><span class="lbl">Claim, then</span><p>${s.systems.transport.a}</p></div><div><span class="lbl">Claim, now</span><p>${s.systems.transport.m}</p></div><div class="lesson"><span class="lbl">Lesson</span><p>${s.systems.transport.l}</p></div></div>
        <div>${badge("debated")} <span class="muted" style="font-size:15px">Sledges are well supported. How much the wet sand helped is still argued.</span></div>`
        :`<p class="title">Sources for ${esc(short(s))} are being gathered</p><p class="muted">The team is checking which sources are legal to use. The claims on the right are drafts waiting for a source link and a reviewer.</p><div class="passage">${s.fact.t}</div><div>${badge(s.fact.g)}</div>`}
    </div>
    <div class="queue">
      <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">Review queue</h3><span class="mono" id="revCount">${done} of ${claims.length} reviewed</span></div><div class="progress"><i id="revBar" style="width:${claims.length?done/claims.length*100:0}%"></i></div></div>
      ${claims.map(c=>{const st=reviewState[k][c.id];return `<div class="claim ${st||""}" data-claim="${c.id}">
        <div class="claim-h"><b>${c.sys}</b>${badge(c.g)}</div><p>${c.a}</p>
        <div class="acts">${st?`<span class="mono">${st==="approved"?"Approved. Now visible in chat.":"Sent back for a better source."}</span><button class="pill ghost" data-rev="undo">Undo</button>`
          :`<button class="pill site" data-rev="approved">Approve</button><button class="pill ghost" data-rev="sent">Send back</button>`}</div></div>`}).join("")}
    </div>
  </div></div>`;
}

/* ---------- 3D site models for Pick a site ---------- */
let MODELS=[];
function disposeModels(){MODELS.forEach(m=>{cancelAnimationFrame(m.raf);m.io&&m.io.disconnect();m.ro&&m.ro.disconnect();m.scene.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()});m.renderer.dispose();m.renderer.domElement.remove();m.el.classList.remove("has3d")});MODELS=[]}
function buildSite(k,T,accent){
  const g=new T.Group();
  const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.95,metalness:0,flatShading:true});
  const add=(geo,c,x=0,y=0,z=0,ry=0)=>{const m=new T.Mesh(geo,typeof c==="string"||typeof c==="number"?mat(c):c);m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=m.receiveShadow=true;g.add(m);return m};
  const box=(w,h,d,c,x,y,z,ry)=>add(new T.BoxGeometry(w,h,d),c,x,y+h/2,z,ry);
  const ground={giza:"#E3C99A",uruk:"#D6C29B",mohenjo:"#D9B79B",qin:"#B7CBA2"}[k];
  add(new T.CylinderGeometry(2.7,2.85,.3,56),ground,0,-.15,0);
  if(k==="giza"){
    const pyr=(r,h,x,z,c,cap)=>{add(new T.ConeGeometry(r,h,4,1),c,x,h/2,z,Math.PI/4);if(cap)add(new T.ConeGeometry(r*.22,h*.22,4,1),"#F6EBD6",x,h*.89,z,Math.PI/4)};
    pyr(1.0,1.35,.85,-.75,"#D9B983");
    pyr(.92,1.28,-.2,.2,"#CFAE78",true);
    pyr(.5,.66,-1.05,1.05,"#C9A46E");
    [[1.85,-.25],[1.85,.2],[1.85,.62]].forEach(([x,z])=>pyr(.17,.22,x,z,"#CDAE7C"));
    box(.5,.14,.16,"#C49E68",.75,0,1.25);box(.14,.14,.14,"#C49E68",.52,.12,1.25);
  }
  if(k==="uruk"){
    const brick="#C7A276";
    box(2.3,.38,1.9,brick,0,0,0);
    box(2.34,.07,1.94,accent,0,.14,0);
    box(1.75,.3,1.42,"#BF9A6D",0,.38,0);
    box(1.28,.26,1.02,brick,0,.68,0);
    box(.95,.42,.58,"#F3EDE2",0,.94,0);
    for(let i=0;i<5;i++) box(.07,.42,.06,"#E6DDCD",-.38+i*.19,.94,.31);
    const ramp=add(new T.BoxGeometry(.34,.08,1.4),brick,0,.46,1.28);ramp.rotation.x=-.62;
    [[-1.9,1.2],[-1.7,-1.4],[1.8,1.35],[1.95,-1.1],[-2.1,-.2]].forEach(([x,z],i)=>box(.32,.18+(i%2)*.08,.28,"#CDB089",x,0,z,i*.5));
  }
  if(k==="mohenjo"){
    const b="#B7684C",b2="#A9593F";
    const W=2.5,D=2.0,hx=.62,hz=.36,h=.26;
    box(W,h,D/2-hz,b,0,0,-(hz+(D/2-hz)/2));
    box(W,h,D/2-hz,b,0,0,(hz+(D/2-hz)/2));
    box(W/2-hx,h,2*hz,b,-(hx+(W/2-hx)/2),0,0);
    box(W/2-hx,h,2*hz,b,(hx+(W/2-hx)/2),0,0);
    box(2*hx,.04,2*hz,"#8E4A36",0,0,0);
    add(new T.BoxGeometry(2*hx-.02,.02,2*hz-.02),new T.MeshStandardMaterial({color:"#5E97C4",roughness:.3,metalness:.1,transparent:true,opacity:.85}),0,.17,0);
    for(let i=0;i<3;i++){box(.4,h-.07*(i+1),.1,b2,0,0,-hz+.05+i*.1);box(.4,h-.07*(i+1),.1,b2,0,0,hz-.05-i*.1)}
    for(let i=0;i<8;i++){const x=-1.05+i*.3;box(.09,.34,.09,"#C27A5C",x,h,-.85);box(.09,.34,.09,"#C27A5C",x,h,.85)}
    for(let i=0;i<5;i++){const z=-.6+i*.3;box(.09,.34,.09,"#C27A5C",-1.15,h,z);box(.09,.34,.09,"#C27A5C",1.15,h,z)}
    box(2.44,.05,.26,b2,0,h+.34,-.85);box(2.44,.05,.26,b2,0,h+.34,.85);
  }
  if(k==="qin"){
    const earth="#C4A57A",hill=x=>.42*Math.exp(-((x-.2)**2)/.8);
    const hm=add(new T.SphereGeometry(1.25,14,8),"#9DB98C",.2,0,-.1);hm.scale.set(1.1,.34,.9);
    const f=x=>Math.sin(x*1.25)*.55;
    for(let x=-2.3;x<2.3;x+=.2){
      const z=f(x),ang=Math.atan2(f(x+.1)-f(x-.1),.2),H=.32+hill(x);
      box(.26,H,.17,earth,x,0,z,-ang);
      box(.09,.08,.17,"#B8986C",x,H,z,-ang);
    }
    [[-1.4],[1.35]].forEach(([x])=>box(.34,.62+hill(x),.34,"#B58F62",x,0,f(x)));
    box(.28,.02,3,"#AE9470",.9,0,1.25);
    box(.28,.02,1.5,"#AE9470",.9,0,-1.9);
  }
  return g;
}
function initModels(){
  disposeModels();
  const T=window.THREE; if(!T) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css=getComputedStyle(document.documentElement);
  document.querySelectorAll("[data-model]").forEach((el,idx)=>{
    const k=el.dataset.model;
    let renderer; try{renderer=new T.WebGLRenderer({antialias:true,alpha:true})}catch(e){return}
    renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
    renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
    renderer.domElement.setAttribute("aria-hidden","true");
    el.appendChild(renderer.domElement); el.classList.add("has3d");
    const scene=new T.Scene();
    const cam=new T.PerspectiveCamera(30,1,.1,50); cam.position.set(0,3.9,8.4); cam.lookAt(0,.15,0);
    scene.add(new T.HemisphereLight(0xfff4e2,0x6b5a44,.62));
    const sun=new T.DirectionalLight(0xfff8ee,.72); sun.position.set(4,6,3); sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-3.5,right:3.5,top:3.5,bottom:-3.5}); scene.add(sun);
    const grp=buildSite(k,T,css.getPropertyValue(`--${k}`).trim()||"#888"); grp.rotation.y=-.5+idx*.7; scene.add(grp);
    const m={el,renderer,scene,raf:0,on:true};
    const size=()=>{const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();renderer.render(scene,cam)};
    let last=performance.now(),boost=0;
    const card=el.closest(".site-card");
    card&&card.addEventListener("pointerenter",()=>boost=1); card&&card.addEventListener("pointerleave",()=>boost=0);
    const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;grp.rotation.y+=dt*(.25+boost*.9);renderer.render(scene,cam);if(m.on)m.raf=requestAnimationFrame(loop)};
    m.ro=new ResizeObserver(size); m.ro.observe(el); size();
    if(!reduce){
      m.io=new IntersectionObserver(([e])=>{m.on=e.isIntersecting;cancelAnimationFrame(m.raf);if(m.on){last=performance.now();m.raf=requestAnimationFrame(loop)}}); m.io.observe(el);
    }
    MODELS.push(m);
  });
}

/* ---------- router ---------- */
let playTimer=null;
function route(){
  clearInterval(playTimer);
  const h=location.hash.replace(/^#/,"");
  if(h && !h.startsWith("/")){ // in-page anchors on home
    if(!$("#sites")) render("/",true);
    document.getElementById(h)?.scrollIntoView({behavior:"smooth"}); return;
  }
  const [path,anchor]=(h||"/").split("#");
  render(path||"/"); if(anchor) setTimeout(()=>document.getElementById(anchor)?.scrollIntoView({behavior:"smooth"}),30);
}
function render(path,keepScroll){
  const p=path.split("/").filter(Boolean); const app=$("#app");
  disposeModels();
  $("#nav-home").toggleAttribute("aria-current",!p.length); if(!p.length) $("#nav-home").setAttribute("aria-current","page");
  if(p[0]==="site" && SITES[p[1]]){
    const k=p[1], mode=p[2];
    document.title=`${short(SITES[k])} | DeCode`;
    app.innerHTML = mode==="chat"?chatView(k): mode==="build"?buildView(k): mode==="decode"?decodeView(k): siteView(k);
    wire(k,mode);
  } else { document.title="DeCode"; app.innerHTML=homeView(); }
  if($("[data-model]")) requestAnimationFrame(initModels); else disposeModels();
  if(!keepScroll) window.scrollTo(0,0);
  paintStatus();
}
function wire(k,mode){
  if(mode==="chat"){
    $("#send").onclick=()=>send(k,$("#q").value);
    $("#q").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();send(k,$("#q").value)}};
    document.querySelectorAll(".sug").forEach(b=>b.onclick=()=>send(k,b.dataset.q));
    pingAPI().then(paintStatus);
    const m=$("#msgs"); m.scrollTop=m.scrollHeight;
  }
  if(mode==="build"){
    document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{buildTab[k]=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));clearInterval(playTimer);$("#tabBody").innerHTML=tabBody(k);wireTab(k)});
    wireTab(k);
  }
  if(mode==="decode"){
    document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{
      const id=b.closest(".claim").dataset.claim; const v=b.dataset.rev;
      if(v==="undo") delete reviewState[k][id]; else reviewState[k][id]=v;
      const y=scrollY; render(`/site/${k}/decode`,true); scrollTo(0,y);
    });
  }
}
function wireTab(k){
  const t=buildTab[k];
  if(t==="teardown") document.querySelectorAll(".sys").forEach(b=>b.onclick=()=>{pickSys[k]=b.dataset.sys;$("#tabBody").innerHTML=tabBody(k);wireTab(k);document.querySelector(`.sys[data-sys="${b.dataset.sys}"]`)?.focus()});
  if(t==="estimator") document.querySelectorAll("[data-est]").forEach(inp=>inp.oninput=()=>{
    const v=parseFloat(inp.value); estState[k][inp.dataset.est]=isFinite(v)&&v>=0?v:0;
    const r=estimate(estState[k]); $("#o-aY").textContent=fmt(r.aY);$("#o-aP").textContent=fmt(r.aP);$("#o-mY").textContent=fmt(r.mY);$("#o-mP").textContent=fmt(r.mP);
  });
  if(t==="now"){
    const r=estimate(estState[k]), yr=$("#yr");
    yr.oninput=()=>{clearInterval(playTimer);paintRace(k,parseFloat(yr.value));$("#play").textContent="Start the build"};
    $("#play").onclick=()=>{
      if(playTimer){clearInterval(playTimer);playTimer=null;$("#play").textContent="Keep building";return}
      let y=parseFloat(yr.value); if(y>=r.aY) y=0;
      const step=r.aY/90; $("#play").textContent="Pause";
      playTimer=setInterval(()=>{y=Math.min(r.aY,y+step);yr.value=y;paintRace(k,y);if(y>=r.aY){clearInterval(playTimer);playTimer=null;$("#play").textContent="Build again"}},60);
    };
    paintRace(k,0);
  }
}

/* theme */
(function(){
  let saved=null; try{saved=localStorage.getItem("decode-theme")}catch(e){}
  if(saved) document.documentElement.dataset.theme=saved;
  $("#theme").onclick=()=>{
    const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; if($("[data-model]")) initModels();
    try{localStorage.setItem("decode-theme",next)}catch(e){}
  };
})();
addEventListener("hashchange",route);
route();
loadLiveData();
</script>
